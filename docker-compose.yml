services:
  backend:
    build:
      context: ./backend
      target: dev           # uses the dev stage which has air installed
    volumes:
      - ./backend:/app      # bind-mount source so air can watch for changes
      - /app/tmp            # anonymous volume keeps air build output off the host
    ports:
      - "8080:8080"
    environment:
      GIN_MODE: debug
      FRONTEND_ORIGIN: "http://localhost:3000"
    networks:
      - app-net

  frontend:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./frontend:/app         # bind-mount source for HMR
      - /app/node_modules       # keep node_modules inside the container
    ports:
      - "3000:3000"
    command: sh -c "bun install && bun run dev --host"
    depends_on:
      - backend
    environment:
      VITE_API_URL: "http://backend:8080"   # SSR server-side fetches
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
