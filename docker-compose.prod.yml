services:
  backend:
    build:
      context: ./backend     # uses the final alpine stage (compiled binary)
    restart: unless-stopped
    environment:
      GIN_MODE: release
      FRONTEND_ORIGIN: "http://${VM_IP}" # Set this in your VM's .env file
    env_file:
      - .env
    networks:
      - app-net
  
  frontend:
    build:
      context: ./frontend    # runs the production SSR server
    restart: unless-stopped
    # 3000 is NOT exposed externally — Caddy proxies to it.
    depends_on:
      - backend
    networks:
      - app-net

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"              # HTTP only (no domain = no auto-HTTPS)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend
      - frontend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  caddy_data:
